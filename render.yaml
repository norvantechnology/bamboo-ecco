# Render Blueprint — NestJS API only (storefront + admin stay on Vercel).
#
# Render Dashboard → New → Blueprint → connect this GitHub repo → branch main.
# Or: New Web Service → same repo, then paste the build/start commands below.
# Fill secret env vars in the Render dashboard (sync: false keys).
#
# If you created a Web Service (not Blueprint), set Build Command in the dashboard to:
#   corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:api
# --prod=false is required: Render sets NODE_ENV=production, which otherwise skips
# turbo/typescript (devDependencies) and the build fails with "turbo: not found".

services:
  - type: web
    name: bamboo-ecco-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    rootDir: .
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm run build:api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 2h
      - key: DEFAULT_TENANT_DOMAIN
        value: localhost
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: bamboo-eco-hub
