# Render Blueprint — NestJS API only.
# Storefront + admin stay on Vercel.
#
# Create the service once: Render Dashboard → New Blueprint → this repo.
# Set production secrets in the Render dashboard (do not commit them).
# Deploys are triggered by .github/workflows/deploy-api.yml (autoDeploy: false).

services:
  - type: web
    name: bamboo-ecco-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: .
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@ecoo/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 2h
      - key: DEFAULT_TENANT_DOMAIN
        value: localhost
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: bamboo-eco-hub
