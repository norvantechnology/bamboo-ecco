name: Deploy API to Render

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "render.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & deploy NestJS API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm turbo run build --filter=@ecoo/api

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Triggering Render deploy via API…"
            DEPLOY_JSON=$(curl -sS -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -d '{"clearCache":"do_not_clear"}')
            echo "$DEPLOY_JSON"
            DEPLOY_ID=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('id') or (d.get('deploy') or {}).get('id') or ''))")
            if [ -z "$DEPLOY_ID" ]; then
              echo "Could not parse deploy id from Render API response"
              exit 1
            fi
            echo "Waiting for deploy ${DEPLOY_ID}…"
            for i in $(seq 1 40); do
              STATUS_JSON=$(curl -sS \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
              STATUS=$(echo "$STATUS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))")
              echo "  status: ${STATUS}"
              case "$STATUS" in
                live|succeeded) echo "Render deploy succeeded."; exit 0 ;;
                failed|canceled|deactivated|build_failed|update_failed|canceled)
                  echo "Render deploy failed: ${STATUS}"
                  exit 1
                  ;;
              esac
              sleep 15
            done
            echo "Timed out waiting for Render deploy"
            exit 1
          fi

          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "Triggering Render deploy hook…"
            HTTP_CODE=$(curl -sS -o /tmp/render-hook.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            cat /tmp/render-hook.txt || true
            echo
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Render deploy hook accepted (HTTP ${HTTP_CODE})."
              exit 0
            fi
            echo "Render deploy hook failed (HTTP ${HTTP_CODE})."
            exit 1
          fi

          echo "Missing Render secrets."
          echo "Add GitHub Actions secrets:"
          echo "  RENDER_API_KEY + RENDER_SERVICE_ID  (preferred)"
          echo "  or RENDER_DEPLOY_HOOK"
          exit 1
